name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test (unit + plugin smoke test)
        run: ctest --test-dir build -C Release --output-on-failure -V
      - name: Package
        run: cmake --build build --config Release --target package_zip
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: tcl-syntaxhl-x64
          path: build/package/tcl-syntaxhl/

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure (sanitizers)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mingw-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build plugin with MinGW (compile check)
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
