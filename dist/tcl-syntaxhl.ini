; tcl-syntaxhl - Total Commander Lister syntax highlighting plugin
; This file must stay next to tcl-syntaxhl.wlx64. Encoding: UTF-8.
; Changes apply the next time a file is opened in Lister (no TC restart needed),
; EXCEPT the extension list in [Languages]: TC caches the plugin's detect string
; when the plugin is installed - see README.md ("Changing file extensions").

[General]
; Tokenizer backend: native | regex
;   native = built-in hand-written lexers (default)
;   regex  = data-driven rules from rules\<language>.rules (json, ini, css, js ship)
;            languages without a rules file fall back to native
tokenizer=native

; Files larger than this are not fully highlighted. Bytes, or K / M / G suffix.
max_highlight_size=2M

; What to do with files larger than max_highlight_size:
;   true  = lazy highlighting (only the visible area is highlighted, while scrolling)
;   false = show as plain text with a notice bar explaining why
use_lazy_highlight=false

; Color theme set: a folder name under themes\, or "auto" to follow
; Total Commander's dark mode (uses theme_light / theme_dark).
theme=auto
theme_light=light
theme_dark=dark

; Font used for the text view (Ctrl+Mouse wheel zooms at runtime).
font_face=Consolas
font_size=10

; Draw comments in italic (as the theme says). false = never italic.
; Can be overridden per language, e.g. [INI] italic_comments=false
italic_comments=true

; Width of a tab character in columns (display only - the file is shown as is).
; Can be overridden per language, e.g. [Python] tab_width=8
tab_width=4

; Let the text view beep when navigation hits the start/end of the file
; (PgDn at the end, ...). Total Commander's own viewer is silent.
allow_beeps=false

; Reserved for the upcoming settings window (context menu "Settings...").
enable_config_dialog=false

[Languages]
; LanguageName=ext1,ext2   (no dots, case-insensitive)
; The lowercase LanguageName selects themes\<set>\<name>.theme and rules\<name>.rules.
; Extra languages can reuse a lexer via "lexer=" in their own section, e.g.:
;   JSONC=jsonc   and   [JSONC] lexer=json / support_jsonc_comments=true
JSON=json
CSS=css
Python=py,pyw
JS=js,mjs,cjs
INI=ini,cfg,inf

; Per-language options. Every language section may also contain:
;   tokenizer=native|regex   (overrides [General] tokenizer for that language)
;   italic_comments=true|false  (overrides [General] italic_comments)
;   tab_width=<1..32>           (overrides [General] tab_width)
;   lexer=<id>               (native lexer to use: json, css, python, js, ini)

[JSON]
; Allow // and /* */ comments (JSONC). When false, comments are marked as errors.
support_jsonc_comments=false

[CSS]
; Enable SCSS/LESS syntax: // comments, $var / @var, nesting, &, #{...},
; @mixin/@include... Tip: add scss,less to CSS= in [Languages] when enabling.
support_scss_less=false
